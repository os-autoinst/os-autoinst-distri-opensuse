      ipv4_cidr: "10.146.14.0/23"

  nodes:
    - id: sonic
      role: nfs_server
      interfaces:
        - id: eno1
          network: mgmt
          ipv4: "10.146.14.84"

    - id: coppi
      role: nfs_client1
