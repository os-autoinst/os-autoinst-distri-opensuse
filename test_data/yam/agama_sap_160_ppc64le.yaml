---
os_release:
  NAME: "SLES"
  PRETTY_NAME: "SUSE Linux Enterprise Server %VERSION%"
  VARIANT: "Enterprise Server for SAP applications"
  VARIANT_ID: "server-sap"
  VERSION_ID: "%VERSION%"
  ID: "sles"
  ID_LIKE: "suse opensuse"
  CPE_NAME: "cpe:/o:suse:sles:16:%VERSION%"
  SUSE_SUPPORT_PRODUCT: "SUSE Linux Enterprise Server for SAP applications"
repos:
  - name: SLE-Product-SLES_SAP-%VERSION%
    alias: SUSE_Linux_Enterprise_Server_for_SAP_applications_%VERSION%_%ARCH%:SLE-Product-SLES_SAP-%VERSION%
    uri: https://updates.suse.com/SUSE/Products/SLE-Product-SLES_SAP/%VERSION%/%ARCH%/product
    enabled: 'Yes'
    filter: name
  - name: SLE-Product-SLES_SAP-%VERSION%-Debug
    alias: SUSE_Linux_Enterprise_Server_for_SAP_applications_%VERSION%_%ARCH%:SLE-Product-SLES_SAP-%VERSION%-Debug
    uri: https://updates.suse.com/SUSE/Products/SLE-Product-SLES_SAP/%VERSION%/%ARCH%/product_debug
    enabled: 'No'
    filter: name
  - name: SLE-Product-SLES_SAP-%VERSION%-Source
    alias: SUSE_Linux_Enterprise_Server_for_SAP_applications_%VERSION%_%ARCH%:SLE-Product-SLES_SAP-%VERSION%-Source
    uri: https://updates.suse.com/SUSE/Products/SLE-Product-SLES_SAP/%VERSION%/%ARCH%/product_source
    enabled: 'No'
    filter: name
selinux:
  status: enabled
  mode: permissive
