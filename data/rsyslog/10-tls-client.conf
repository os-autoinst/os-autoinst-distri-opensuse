# ========================================================
# RSYSLOG TLS CLIENT CONFIGURATION
# Location: /etc/rsyslog.d/10-tls-client.conf
# ========================================================

# 1. Global OpenSSL Driver Configuration
# Client only needs the CA certificate to verify the Server's identity
global(
  DefaultNetstreamDriver="ossl"
  DefaultNetstreamDriverCAFile="/etc/rsyslog-certs/ca.pem"
)

# 2. Secure Outbound Routing Rule
# In-memory action queue: buffers logs while the server is unreachable and
# keeps a stalled TLS connection from blocking other actions (e.g. omdtls)
*.* action(
  type="omfwd"
  name="tls_fwd"
  target="server"
  protocol="tcp"
  port="6514"
  StreamDriver="ossl"
  StreamDriverMode="1"          # Force TLS encryption
  StreamDriverAuthMode="anon"   # Encrypted, but server identity is not verified
  queue.type="LinkedList"
  queue.size="10000"
  action.resumeRetryCount="-1"
  action.resumeInterval="2"
)
