  # imdtls: connectionless (UDP) syslog reception protected by DTLS 1.2.
  # The ruleset must be declared before the input that binds to it.
 module(load="imdtls")

  template(name="dtlsfile" type="string"
           string="/var/log/remote/dtls-%HOSTNAME:::secpath-replace%.log")

  ruleset(name="dtls_remote") {
      action(type="omfile" dynaFile="dtlsfile")
  }

  input(type="imdtls"
        port="4433"
        tls.cacert="/etc/rsyslog-certs/ca.pem"
        tls.mycert="/etc/rsyslog-certs/server-cert.pem"
        tls.myprivkey="/etc/rsyslog-certs/server-key.pem"
        tls.authmode="certvalid"
        ruleset="dtls_remote")

