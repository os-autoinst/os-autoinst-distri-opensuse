# nginx virtual host configuration file for SSL with ML-DSA key and ML-KEM key exchange algorithms
server {
    # listen on IPv4 only: an IPv6 listen directive prevents nginx from starting when IPv6 is disabled
    listen       443 ssl;
    server_name  pqtest.local;

    ssl_certificate      /etc/nginx/ssl/server_mldsa.crt;
    ssl_certificate_key  /etc/nginx/ssl/server_mldsa.key;

    # restrict protocol to v1.3 TLS, the only one which supports Post-Quantum Crypto
    ssl_protocols        TLSv1.3;
    # restrict group/curve negotiation strictly to pure Post-Quantum KEMs
    ssl_ecdh_curve       mlkem512:mlkem768:mlkem1024;

    root /srv/www/htdocs;

    location / {
        try_files $uri $uri/ =404;
    }
}
