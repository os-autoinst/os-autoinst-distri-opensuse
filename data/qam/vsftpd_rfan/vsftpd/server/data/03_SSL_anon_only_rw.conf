#Standalone mode
listen=YES
max_clients=200
max_per_ip=4
# Access rights
anonymous_enable=YES
anon_root=/srv/ftp/anon
ftp_username=ftp
nopriv_user=ftp
# deny local users to log in
local_enable=NO
write_enable=YES
anon_upload_enable=YES
anon_mkdir_write_enable=YES
anon_other_write_enable=YES
# Security
anon_world_readable_only=YES
# workaround to download files as anonym(bnc#1012037)
anon_umask=0033
# make sure PORT transfer connections originate from port 20 (ftp-data).
connect_from_port_20=YES
hide_ids=YES
pasv_min_port=50000
pasv_max_port=60000
# Features
xferlog_enable=YES
ls_recurse_enable=NO
ascii_download_enable=NO
async_abor_enable=YES
# Performance
one_process_model=YES
idle_session_timeout=120
data_connection_timeout=300
accept_timeout=60
connect_timeout=60
anon_max_rate=50000

# login banner string
ftpd_banner=Welcome - Anonymous access only

ascii_download_enable=YES

# enable ssl
ssl_enable=YES
force_local_data_ssl=yes
rsa_cert_file=/etc/vsftpd/vsftpd.pem
allow_anon_ssl=YES
# http://bugzilla.suse.com/show_bug.cgi?id=1116571
seccomp_sandbox=NO

local_root=/srv/ftp/users/$USER
require_ssl_reuse=NO
