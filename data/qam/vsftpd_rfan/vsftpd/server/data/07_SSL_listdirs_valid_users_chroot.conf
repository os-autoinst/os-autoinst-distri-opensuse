#disallow anonymous ftp access
anonymous_enable=YES
anon_root=/srv/ftp/anon

# allow local users to log in
local_enable=YES

# allow FTP write commands
write_enable=NO

# umask for local users, (022 is used by most other ftpd's)
local_umask=022

# make sure PORT transfer connections originate from port 20 (ftp-data).
#connect_from_port_20=YES

# disable chmod, default is YES
chmod_enable=NO

# login banner string
ftpd_banner=Welcome - Local and anonymous users access

# enable/specifiy list of local users to chroot() to their home directory.
# if chroot_local_user is YES, then this list becomes a list of users to NOT chroot().
chroot_list_enable=NO

# authentication service
pam_service_name=vsftpd

# disable user list
userlist_enable=NO

# enable for standalone mode
listen=YES

ascii_upload_enable=YES
ascii_download_enable=YES

# define port range for passive mode connections
pasv_enable=YES
#pasv_max_port=65535
#pasv_min_port=64000

local_root=/srv/ftp/users/$USER

# enable ssl
ssl_enable=YES
force_local_data_ssl=yes
rsa_cert_file=/etc/vsftpd/vsftpd.pem
allow_anon_ssl=YES

# http://bugzilla.suse.com/show_bug.cgi?id=1116571
seccomp_sandbox=NO

# security
anon_world_readable_only=YES
require_ssl_reuse=NO
