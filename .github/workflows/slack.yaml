name: Minimal PR Slack Notification
on:
  pull_request:
    types: [opened]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Minimal Slack Message
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{
            "text": "New PR from ${{ github.actor }}: <${{ github.event.pull_request.html_url }}|${{ github.event.pull_request.title }}>",
            "unfurl_links": false,
            "unfurl_media": false
          }' \
          ${{ secrets.SLACK_WEBHOOK_URL }}
