---
name: publiccloud_ltp_maintenance
description: |
  Run LTP on a Public Cloud instance after applying the maintenance updates
  under test. Minimal skeleton, see poo#206889.
vars:
  TEST_CONTEXT: 'OpenQA::Test::RunArgs'
  PUBLIC_CLOUD_LTP: '1'
schedule:
  - boot/boot_to_desktop
  - publiccloud/download_repos
  - publiccloud/prepare_instance
  - publiccloud/registration
  - publiccloud/transfer_repos
  - publiccloud/patch_and_reboot
  - publiccloud/run_ltp
  - publiccloud/destroy
