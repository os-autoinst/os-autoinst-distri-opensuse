name:           agama_nfs_3hosts_baremetal
description:    >
    Install three bare metal machines with Agama, then run the NFS server and
    client tests with one server and two clients. The machines come from
    test_data/kernel/multimachine/nfs_3hosts.yaml. Set ROLE to nfs_server,
    nfs_client1 or nfs_client2; the nfs_server job is the parallel parent.
vars:
    INST_AUTO: agama_auto/sle_default_ipmi.jsonnet
    LTP_BAREMETAL: '1'
test_data:
    <<: !include test_data/kernel/multimachine/nfs_3hosts.yaml
    multimachine_barriers:
        - NFS_BEFORE_TEST_DONE
        - NFS_SERVER_ENABLED
        - NFS_CLIENT_ENABLED
        - NFS_SERVER_CHECK
conditional_schedule:
    nfstest:
        ROLE:
            nfs_server:
                - kernel/nfs_server
            nfs_client1:
                - kernel/nfs_client
            nfs_client2:
                - kernel/nfs_client
schedule:
    - kernel/multimachine_barriers
    - installation/ipxe_install
    - installation/agama_reboot
    - installation/grub_test
    - installation/first_boot
    - kernel/update_kernel
    - kernel/before_nfs_test
    - '{{nfstest}}'
