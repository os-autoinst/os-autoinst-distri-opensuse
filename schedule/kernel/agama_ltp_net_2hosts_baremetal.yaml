name:           agama_ltp_net_2hosts_baremetal
description:    >
    Install two bare metal machines with Agama and LTP, then run LTP network
    tests from LTP_COMMAND_FILE on the lhost against the rhost (RHOST in
    tst_net.sh). The machines come from
    test_data/kernel/multimachine/ltp_net_2hosts.yaml. Set ROLE to rhost or
    lhost; the rhost job is the parallel parent and sets no LTP_COMMAND_FILE.
    See ROLE in tests/kernel/run_ltp.pm.
vars:
    INST_AUTO: agama_auto/sle_default_ipmi.jsonnet
    LTP_BAREMETAL: '1'
test_data:
    <<: !include test_data/kernel/multimachine/ltp_net_2hosts.yaml
    multimachine_barriers:
        - LTP_NET_RHOST_READY
schedule:
    - kernel/multimachine_barriers
    - installation/ipxe_install
    - installation/agama_reboot
    - installation/grub_test
    - installation/first_boot
    - kernel/update_kernel
    - console/system_prepare
    - kernel/install_ltp
