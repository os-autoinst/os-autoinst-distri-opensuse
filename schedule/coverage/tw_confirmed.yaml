    nftables: /usr/sbin/nft
    tar: /usr/bin/tar
    traceroute: /usr/sbin/traceroute
    unzip: /usr/bin/unzip
    vim: /usr/bin/vim-nox11
    wavpack:
      - /usr/bin/wavpack
      - /usr/bin/wvunpack
      - /usr/bin/wvgain               # job 147
    kmod: /usr/bin/kmod
    rpm: /usr/bin/rpm
    sqlite3: /usr/bin/sqlite3
