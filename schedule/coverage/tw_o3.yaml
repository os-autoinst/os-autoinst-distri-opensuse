    udisks2: /usr/bin/udisksctl
    unixODBC:
      - /usr/bin/isql
      - /usr/bin/odbcinst
    socat: /usr/bin/socat  # reported as socat1
    libgpiod-utils:
      - /usr/bin/gpiodetect
      - /usr/bin/gpioinfo
      - /usr/bin/gpioset
      - /usr/bin/gpioget
    ImageMagick: /usr/bin/identify
    mokutil: /usr/bin/mokutil
    irqbalance: /usr/sbin/irqbalance
    man:
      - /usr/bin/man
      - /usr/bin/manpath
    openscap-utils: /usr/bin/oscap
    snapper:
      - /usr/bin/snapper
      - /usr/sbin/snapperd
    policycoreutils:
      - /usr/sbin/setfiles  # restorecon is a symlink to setfiles
      - /usr/sbin/semodule
      - /usr/sbin/setsebool
      - /usr/bin/sestatus
    systemd:
      - /usr/bin/run0  # symlink to systemd-run, pulls in systemd-debuginfo
      - /usr/bin/bootctl
      - /usr/bin/systemctl
      - /usr/bin/systemd-detect-virt
      - /usr/bin/systemd-analyze
      - /usr/bin/journalctl
      - /usr/bin/coredumpctl
      - /usr/bin/timedatectl
      - /usr/bin/localectl
