test_data:
  disks:
    - name: vda
      table_type: gpt
  helper_packages:
    - gzip
    - iputils
    - systemd
    - wget
    # Large test prerequisites are installed here, before any binary is
    # instrumented: a shimmed zypper invocation costs ~30-40 s even when it
    # has nothing to do. Modules keep their own zypper commands, so the
    # instrumented path is still exercised; only the already-satisfied
    # transaction is skipped.
    - yast2-country                    # yast_lang, yast_timezone
    - libusbguard1                     # usbguard
    - usbguard
    - usbguard-devel
    - usbguard-tools
    - usbutils
    - alsa                             # wavpack
    - alsa-utils
    - rsyslog                          # syslog
    - python3-pytest                   # gpg_agnostic
    - libgcrypt20-hmac
    - mkisofs                          # udisks2
    - lynis                            # lynis_setup
    - apache2
    - apache2-utils
    - ruby4.0                          # ruby
    - libaom-devel                     # libaom
    - gcc                              # libaom, gcc, gdb
    - make
    - nasm
    - mariadb                          # mariadb_srv, mariadb_odbc
    - mariadb-connector-odbc
    - osinfo-db                        # osinfo_db
    - libosinfo
    - bind                             # dns_srv
    - libgccjit-devel                  # gcc
    - glibc-devel                      # gdb
    - nss-pam-ldapd                    # pam_config
    - expect                           # sqlite3
    - perl
    - quota-nfs                        # quota
    - ksh                              # shells
    - pam_u2f                          # pam_u2f
  coverage_targets:
    # Not instrumented on purpose: sudo (setuid binaries cannot be shimmed),
    # sshd-session and sshd-auth (shimming them breaks SSH on the serial terminal).
    bzip2: /usr/bin/bzip2
    cpio: /usr/bin/cpio
    curl: /usr/bin/curl
    gd:
      - /usr/bin/giftogd2
      - /usr/bin/gd2togif
      - /usr/bin/gd2topng
      - /usr/bin/gdcmpgif
      - /usr/bin/pngtogd
      - /usr/bin/gdtopng
      - /usr/bin/webpng
    lshw: /usr/sbin/lshw
    nano: /usr/bin/nano
    net-snmp:
      - /usr/bin/snmpget
      - /usr/bin/snmpset
      - /usr/bin/snmpusm
    nftables: /usr/sbin/nft
    tar: /usr/bin/tar
    traceroute: /usr/sbin/traceroute
    unzip: /usr/bin/unzip
    vim: /usr/bin/vim-nox11
    wavpack:
      - /usr/bin/wavpack
      - /usr/bin/wvunpack
      - /usr/bin/wvgain
    alsa-utils: /usr/bin/aplay
    kmod: /usr/bin/kmod
    rpm: /usr/bin/rpm
    sqlite3: /usr/bin/sqlite3
    wget: /usr/bin/wget
    zbar: /usr/bin/zbarimg
    chrony: /usr/bin/chronyc
    dnsmasq: /usr/sbin/dnsmasq
    gpg2:
      - /usr/bin/gpg
      - /usr/bin/gpgconf
      - /usr/bin/gpg-agent
      - /usr/bin/gpgsm
      - /usr/bin/gpg-connect-agent
      - /usr/libexec/scdaemon
    dirmngr:
      - /usr/bin/dirmngr
      - /usr/bin/dirmngr-client
    postfix:
      - /usr/sbin/postfix
      - /usr/sbin/postconf
      - /usr/lib/postfix/bin/master
      - /usr/lib/postfix/bin/qmgr
      - /usr/lib/postfix/bin/pickup
      - /usr/lib/postfix/bin/cleanup
      - /usr/lib/postfix/bin/bounce
      - /usr/lib/postfix/bin/local
      - /usr/lib/postfix/bin/trivial-rewrite
      - /usr/sbin/postalias
      - /usr/sbin/postsuper
    quota:
      - /usr/bin/quota
      - /usr/sbin/quotacheck
      - /usr/sbin/quotaon
      - /usr/sbin/setquota
      - /usr/sbin/repquota
    iputils:
