name: coverage - Tumbleweed production schedule
description: >
    Tumbleweed binary coverage schedule, run on o3 for every snapshot as
    TEST=binary_coverage_ultimate. coverage_setup instruments the
    coverage_targets with funkoverage, stock test modules exercise them and
    coverage_report writes the reports. Runs as a child of
    create_hdd_agama_textmode; the job group sets the image settings.
    Instrumented binaries make package operations much slower, so all test
    timeouts are doubled.
    Maintainer: amanzini / balogh
vars:
  BINARY_COVERAGE: 1
  TIMEOUT_SCALE: 2
schedule:
  - installation/bootloader_start
  - boot/boot_to_desktop
  - console/system_prepare
  - console/consoletest_setup
  - coverage/coverage_setup
  - console/clamav
  - console/redis
  - network/snmp
  - console/cpio
  - console/curl_https
  - console/gd
  - console/kmod
  - console/lshw
  - console/nano
  - console/nftables
  - console/rpm
  - console/sqlite3
  - console/tar
  - console/unzip
  - console/vim
  - console/wavpack
  - console/wget_https
  - console/zbar
  - console/chrony
  - console/dnsmasq
  - console/oqa_agnostic/gpg_agnostic
  - console/mta
  - console/quota
  - console/arping
  - console/ping
  - console/tracepath
  - console/traceroute
  - console/openssl_alpn
  - console/cron
  - console/syslog
  - console/timezone
  - console/nginx
  - console/libvorbis
  - console/libxslt
  - console/valkey
  - console/ruby
  - console/gdb
  - console/pkcon
  - console/shells
  - console/update_alternatives
  - console/valgrind
  - console/zziplib
  - console/dig
  - console/lsof
  - console/perf
  - console/procps
  - console/osinfo_db
  - console/gcc
  - console/cryptsetup
  - console/mdadm
  - console/vsftpd
  - console/fwupd
  - security/audit/auditctl
  - security/audit/auditd
  - security/audit/autrace
  - console/pciutils
  - security/lynis/lynis_setup
  - security/usbguard/usbguard
  - hpc/cpuid
  - security/pam/pam_config
  - console/mariadb_srv
  - console/udisks2
  - console/mariadb_odbc
  - console/systemd_resolved
  - console/check_default_network_manager
  - console/libgpiod
  - console/libaom
  - console/btrfs_check
  - console/validate_partition_table_via_blkid
  - console/snapper_create
  - console/suse_module_tools
  - console/apache
  - console/btrfsmaintenance
  - console/snapper_cleanup
  - console/snapper_used_space
  - console/irqbalance
  - console/man_pages
  - console/dns_srv
  - console/textinfo
  - qemu/info
  - security/pam/pam_u2f
  - console/ca_certificates_mozilla
  - security/pam/pam_basic_function
  - security/crypto_policies/crypto_policies_setup
  - security/selinux/sestatus
  - security/selinux/selinuxexeccon
  - yast2_cmd/yast_lang
  - yast2_cmd/yast_timezone
  - security/openscap/oscap_setup
  - security/openscap/oscap_info
  - security/openscap/oscap_oval_scanning
  - security/selinux/semodule
  - security/selinux/chcon
  - fips/openssl/dirmngr_setup
  - fips/openssl/dirmngr_daemon
  - console/run0
  - console/systemd_nspawn
  - console/sysstat
  - console/sshd
  - security/audit/aulast
  - console/tcpdump
  - console/cups
  - console/rpcbind
  - console/postgresql_server
  - console/git
  - console/rsync
