name: selinux
description: >
    This is for SElinux test
schedule:
    - '{{bootloader_zkvm}}'
    - '{{sle_os_boot}}'
    - '{{alp_boot}}'
    - '{{scc_slem}}'
    - security/selinux/selinux_setup
    - security/selinux/sestatus
    - '{{sle_os_tests}}'
    - security/selinux/semanage_fcontext
    - security/selinux/semanage_boolean
    - security/selinux/fixfiles
    - '{{selinux_print_se_context}}'
    - security/selinux/audit2allow
    - security/selinux/semodule
    - security/selinux/setsebool
    - '{{selinux_tools}}'
    - security/selinux/set_get_enforce
    - '{{selinux_execcon}}'
    - security/selinux/setroubleshootd
    - '{{alp_shutdown}}'
conditional_schedule:
    bootloader_zkvm:
        ARCH:
            s390x:
                - installation/bootloader_zkvm
            ppc64le:
                - installation/bootloader_start
    sle_os_boot:
        DISTRI:
            sle:
                - boot/boot_to_desktop
            opensuse:
                - boot/boot_to_desktop
    alp_boot:
        ENCRYPTED_IMAGE:
            0:
                - microos/disk_boot
                - transactional/host_config
            1:
                - jeos/firstrun
                - transactional/host_config
    scc_slem:
        DISTRI:
            sle-micro:
                - console/suseconnect_scc
            alp:
                - console/suseconnect_scc
    sle_os_tests:
        DISTRI:
            sle:
                - security/selinux/selinux_smoke
                - security/selinux/enforcing_mode_setup
            opensuse:
                - security/selinux/selinux_smoke
                - security/selinux/enforcing_mode_setup
    alp_shutdown:
        DISTRI:
            alp:
                - console/journal_check
                - shutdown/shutdown
            sle-micro:
                - console/journal_check
                - shutdown/shutdown
    # SL Micro repositories do not provide python3-pytest and SLE 12 ships
    # Python 3.4, which the agnostic selinux_tools test does not support, so
    # SL Micro and SLE 12-SP5 keep the old modules. On SLE 12-SP5 the
    # selinux_tools module is also scheduled (DISTRI sle), but it skips itself.
    selinux_print_se_context:
        DISTRI:
            sle-micro:
                - security/selinux/print_se_context
            alp:
                - security/selinux/print_se_context
        VERSION:
            12-SP5:
                - security/selinux/print_se_context
    selinux_tools:
        DISTRI:
            sle:
                - security/oqa_agnostic/selinux_tools
            opensuse:
                - security/oqa_agnostic/selinux_tools
            sle-micro:
                - security/selinux/restorecon
                - security/selinux/chcon
                - security/selinux/chcat
            alp:
                - security/selinux/restorecon
                - security/selinux/chcon
                - security/selinux/chcat
        VERSION:
            12-SP5:
                - security/selinux/restorecon
                - security/selinux/chcon
                - security/selinux/chcat
    selinux_execcon:
        DISTRI:
            sle-micro:
                - security/selinux/selinuxexeccon
            alp:
                - security/selinux/selinuxexeccon
        VERSION:
            12-SP5:
                - security/selinux/selinuxexeccon
