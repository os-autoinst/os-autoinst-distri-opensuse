name: fips_ker_mode_tests_crypt_core_qcow
description: >
  Test fips_ker_mode_tests_crypt_core using preinstalled qcow2 images in immutable mode
schedule:
  - '{{boot}}'
  - '{{firstboot}}'
  - transactional/host_config
  - console/suseconnect_scc
  - microos/services_enabled
  - transactional/disable_timers
  - security/selinux/selinux_setup
  - fips/fips_setup
  - fips/openssl/openssl_fips_alglist
  - fips/openssl/openssl_fips_hash
  - fips/openssl/openssl_fips_cipher
  - console/openssl_alpn
  - fips/gnutls/gnutls_base_check
  - fips/gnutls/gnutls_server
  - fips/gnutls/gnutls_client
  - fips/openssl/openssl_pubkey_rsa
  - fips/openssl/openssl_pubkey_dsa
  - fips/openssl/openssl_fips_dhparam
  - fips/openssh/openssh_fips
  - console/sshd
  - console/ssh_cleanup
conditional_schedule:
  firstboot:
    HDDSECTORSIZE_1:
      # The Transactional-Base-ppc-4096 images (4096 byte sector disk) are
      # configured on first boot by a seed disk (HDD_2, cloud-init or
      # ignition), so the jeos-firstboot wizard never runs. It would also only
      # be rendered on the serial console there, so wait for the login prompt
      # instead of the wizard. Every other image keeps running jeos/firstrun.
      4096:
        - installation/first_boot
      +undefined:
        - jeos/firstrun
  boot:
    ARCH:
      s390x:
        - installation/bootloader_start
    # The image boots with "console=ttyAMA0" only, so /dev/console is the
    # serial port and jeos-firstboot renders there instead of on the
    # graphical console. bootloader_uefi appends "console=tty", which the
    # needle based modules that follow need. Non-UEFI systems boot the
    # image directly and need no bootloader module.
    UEFI:
      '1':
        - installation/bootloader_uefi
