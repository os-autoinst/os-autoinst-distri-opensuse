name: selinux-transactional-qcow
description: >
  Test selinux using preinstalled qcow2 images in immutable mode
schedule:
  - '{{boot}}'
  - jeos/firstrun
  - transactional/host_config
  - console/suseconnect_scc
  - microos/services_enabled
  - transactional/disable_timers
  - security/selinux/selinux_setup
  - security/selinux/selinux_smoke
  - security/selinux/container_selinux
  - shutdown/shutdown
conditional_schedule:
  boot:
    ARCH:
      s390x:
        - installation/bootloader_start
    # The image boots with "console=ttyAMA0" only, so /dev/console is the
    # serial port and jeos-firstboot renders there instead of on the
    # graphical console. bootloader_uefi appends "console=tty", which the
    # needle based modules that follow need. Non-UEFI systems boot the
    # image directly and need no bootloader module.
    UEFI:
      '1':
        - installation/bootloader_uefi
